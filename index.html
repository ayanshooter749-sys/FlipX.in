<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipx.in - Earn Without Limit</title>
    <!-- Google Search Console Verification Tag -->
    <meta name="google-site-verification" content="ggr-hILI6CW1IdM4dAP2YuMQMcuiWpomZzOzCwywAqw" />
    <style>
        :root {
            --primary: #7c3aed;
            --secondary: #5b21b6;
            --bg: #faf5ff;
            --text: #1e1b4b;
            --light: #ede9fe;
            --white: #ffffff;
            --muted: #6b7280;
            --success: #10b981;
            --danger: #ef4444;
            --shadow: 0 4px 24px rgba(124,58,237,0.15);
            --radius: 16px;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        .card-box {
            background: var(--white);
            padding: 20px;
            border-radius: var(--radius);
            margin-bottom: 15px;
            box-shadow: var(--shadow);
            border: 1px solid var(--light);
        }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .game-btn {
            padding: 15px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-a { background-color: var(--danger); }
        .btn-b { background-color: var(--success); }
        .btn-c { background-color: var(--primary); }
        .btn-d { background-color: #f59e0b; }
        .game-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        input {
            padding: 12px;
            width: 100%;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            margin-bottom: 12px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .submit-btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 12px;
            font-weight: bold;
            border-radius: 10px;
            width: 100%;
            cursor: pointer;
            font-size: 14px;
        }
        .logout-btn { background: var(--danger); margin-top: 10px; }
        .withdraw-btn { background: var(--danger); }
        .history-table {
            width: 100%;
            text-align: center;
            font-size: 13px;
            color: var(--muted);
            border-collapse: collapse;
        }
        .history-table th, .history-table td {
            padding: 10px;
            border-bottom: 1px solid var(--light);
        }
        .history-table th { color: var(--primary); }
        .auth-switch {
            text-align: center;
            font-size: 13px;
            color: var(--primary);
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }
        h2, h3 { color: var(--text); margin-top: 0; }
    </style>
</head>
<body>

    <div class="container">
        <!-- AUTH SECTION -->
        <div id="auth-section" class="card-box">
            <h2 id="auth-title" style="text-align: center;">🔐 Login to FlipX</h2>
            <input type="email" id="auth-email" placeholder="Enter Email Address">
            <input type="password" id="auth-password" placeholder="Enter Password">
            <button class="submit-btn" id="auth-btn" onclick="handleAuth()">Login</button>
            <div class="auth-switch" id="auth-switch-text" onclick="toggleAuthMode()">Don't have an account? Register here</div>
        </div>

        <!-- MAIN GAME DASHBOARD -->
        <div id="game-section" style="display: none;">
            <div class="card-box" style="text-align: center;">
                <h3 style="margin-bottom: 5px;">Balance: ₹<span id="user-balance">0</span></h3>
                <p style="font-size: 12px; color: var(--muted); margin: 0;" id="user-email-display">User: </p>
                <p style="font-size: 14px; color: var(--primary); margin-top: 8px; font-weight: bold;">
                    Next Result In: <span id="timer" style="font-size: 18px; font-weight: 800;">60</span>s
                    <br><span id="status-text" style="color: var(--success); font-size: 12px;">(Betting Open)</span>
                </p>
                <button class="submit-btn logout-btn" onclick="logoutUser()">Logout</button>
            </div>

            <div class="card-box">
                <h3 style="font-size: 15px;">🎮 Place Your Bet</h3>
                <input type="number" id="bet-amount" placeholder="Enter Bet Amount (₹)">
                <div class="btn-grid" style="margin-top: 10px; margin-bottom: 0;">
                    <button class="game-btn btn-a" onclick="placeBet('A')">Maruti<br><span style="font-size:11px;">4x Payout</span></button>
                    <button class="game-btn btn-b" onclick="placeBet('B')">Spider Man<br><span style="font-size:11px;">4x Payout</span></button>
                    <button class="game-btn btn-c" onclick="placeBet('C')">Super Man<br><span style="font-size:11px;">4x Payout</span></button>
                    <button class="game-btn btn-d" onclick="placeBet('D')">Krrish<br><span style="font-size:11px;">4x Payout</span></button>
                </div>
            </div>

            <div class="card-box">
                <h3 style="font-size: 15px;">💳 Deposit Money (Min ₹30)</h3>
                <input type="number" id="dep-amount" placeholder="Enter Amount (Min ₹30)">
                <input type="text" id="dep-utr" placeholder="Enter 12-Digit UTR Number" maxlength="12">
                <button class="submit-btn" onclick="submitDepositLocal()">Submit Deposit Request</button>
            </div>

            <div class="card-box">
                <h3 style="font-size: 15px;">💸 Withdraw Money (₹400 - ₹1000)</h3>
                <p style="font-size: 11px; color: var(--muted); margin-bottom: 8px;">* 1% Commission/Fee applicable on withdrawal</p>
                <input type="number" id="wd-amount" placeholder="Withdraw Amount (₹400 to ₹1000)">
                <input type="text" id="wd-upi" placeholder="Enter UPI ID (e.g. okaxis)">
                <button class="submit-btn withdraw-btn" onclick="submitWithdrawalLocal()">Request Withdrawal</button>
            </div>

            <div class="card-box">
                <h3 style="text-align: center; font-size: 15px;">Live Game History</h3>
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>Period</th>
                            <th>Winner</th>
                        </tr>
                    </thead>
                    <tbody id="history-body">
                        <tr><td colspan="2" style="color: var(--muted);">No history yet</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let isLoginMode = true;
        let periodNumber = Number(localStorage.getItem("flipx_period")) || 2026092201;
        let isProcessingWinner = false;
        const TOTAL_TIME = 60;

        window.onload = function() {
            let loggedUser = localStorage.getItem("flipx_logged_in_user");
            if (loggedUser) {
                document.getElementById("auth-section").style.display = "none";
                document.getElementById("game-section").style.display = "block";
                updateUI();
                startTimer();
            } else {
                document.getElementById("auth-section").style.display = "block";
                document.getElementById("game-section").style.display = "none";
            }
        };

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            let title = document.getElementById("auth-title");
            let btn = document.getElementById("auth-btn");
            let switchText = document.getElementById("auth-switch-text");

            if (isLoginMode) {
                title.innerText = "🔐 Login to FlipX";
                btn.innerText = "Login";
                switchText.innerText = "Don't have an account? Register here";
            } else {
                title.innerText = "📝 Register for FlipX";
                btn.innerText = "Register";
                switchText.innerText = "Already have an account? Login here";
            }
        }

        function handleAuth() {
            let email = document.getElementById("auth-email").value.trim();
            let pass = document.getElementById("auth-password").value.trim();

            if (!email || !pass) {
                alert("Kripya email aur password dono bharein!");
                return;
            }

            let users = JSON.parse(localStorage.getItem("flipx_users")) || {};

            if (isLoginMode) {
                if (users[email] && users[email].password === pass) {
                    localStorage.setItem("flipx_logged_in_user", email);
                    alert("Login Successful!");
                    location.reload();
                } else {
                    alert("Galat email ya password hai!");
                }
            } else {
                if (users[email]) {
                    alert("Yeh email pehle se registered hai! Login karein.");
                    return;
                }
                users[email] = { password: pass, balance: 0, hasPlayed: false };
                localStorage.setItem("flipx_users", JSON.stringify(users));
                localStorage.setItem("flipx_logged_in_user", email);
                alert("Registration Successful!");
                location.reload();
            }
        }

        function logoutUser() {
            localStorage.removeItem("flipx_logged_in_user");
            location.reload();
        }

        function updateUI() {
            let email = localStorage.getItem("flipx_logged_in_user");
            let users = JSON.parse(localStorage.getItem("flipx_users")) || {};

            if (users[email]) {
                document.getElementById("user-balance").innerText = users[email].balance;
                document.getElementById("user-email-display").innerText = "User: " + email;
            }
            loadHistory();
        }

        function loadHistory() {
            let historyList = JSON.parse(localStorage.getItem("flipx_history")) || [];
            let historyBody = document.getElementById("history-body");

            if (!historyList || historyList.length === 0) {
                historyBody.innerHTML = '<tr><td colspan="2" style="color: var(--muted);">No history yet</td></tr>';
                return;
            }

            let cardNames = { 'A': 'Maruti', 'B': 'Spider Man', 'C': 'Super Man', 'D': 'Krrish' };
            let html = "";
            historyList.forEach(item => {
                html += '<tr><td>' + item.period + '</td><td><strong style="color: var(--primary);">' + cardNames[item.winner] + '</strong></td></tr>';
            });
            historyBody.innerHTML = html;
        }

        function startTimer() {
            setInterval(() => {
                let timeLeft = Number(localStorage.getItem("flipx_timer"));
                
                if (isNaN(timeLeft) || timeLeft <= 0 || timeLeft > TOTAL_TIME) {
                    timeLeft = TOTAL_TIME;
                    periodNumber++;
                    localStorage.setItem("flipx_period", periodNumber);
                    declareWinner();
                } else {
                    timeLeft--;
                }

                localStorage.setItem("flipx_timer", timeLeft);
                let timerElem = document.getElementById("timer");
                if (timerElem) timerElem.innerText = timeLeft;

                let statusText = document.getElementById("status-text");
                let buttons = document.querySelectorAll(".game-btn");

                if (statusText) {
                    if (timeLeft <= 5) {
                        statusText.innerText = "(Betting Closed)";
                        statusText.style.color = "var(--danger)";
                        buttons.forEach(btn => btn.disabled = true);
                    } else {
                        statusText.innerText = "(Betting Open)";
                        statusText.style.color = "var(--success)";
                        buttons.forEach(btn => btn.disabled = false);
                    }
                }
            }, 1000);
        }

        function placeBet(card) {
            let timeLeft = Number(localStorage.getItem("flipx_timer")) || TOTAL_TIME;
            if (timeLeft <= 5) {
                alert("Abhi betting band ho chuki hai!");
                return;
            }

            let betAmt = Number(document.getElementById("bet-amount").value);
            let email = localStorage.getItem("flipx_logged_in_user");
            let users = JSON.parse(localStorage.getItem("flipx_users")) || {};
            let currentBal = users[email] ? users[email].balance : 0;

            let cardNames = { 'A': 'Maruti', 'B': 'Spider Man', 'C': 'Super Man', 'D': 'Krrish' };

            if (!betAmt || betAmt <= 0) {
                alert("Kripya valid bet amount dalein!");
                return;
            }

            if (betAmt > currentBal) {
                alert("Aapke account mein insufficient balance hai! Pehle deposit karein.");
                return;
            }

            users[email].balance = currentBal - betAmt;
            users[email].hasPlayed = true;
            localStorage.setItem("flipx_users", JSON.stringify(users));
            updateUI();

            let totalBets = JSON.parse(localStorage.getItem("flipx_total_bets")) || { A: 0, B: 0, C: 0, D: 0 };
            let userBetsThisRound = JSON.parse(localStorage.getItem("flipx_user_bets")) || { A: 0, B: 0, C: 0, D: 0 };

            totalBets[card] += betAmt;
            userBetsThisRound[card] += betAmt;

            localStorage.setItem("flipx_total_bets", JSON.stringify(totalBets));
            localStorage.setItem("flipx_user_bets", JSON.stringify(userBetsThisRound));

            alert("Successfully placed ₹" + betAmt + " on " + cardNames[card] + "!");
            document.getElementById("bet-amount").value = "";
        }

        function declareWinner() {
            if (isProcessingWinner) return;
            isProcessingWinner = true;

            let totalBets = JSON.parse(localStorage.getItem("flipx_total_bets")) || { A: 0, B: 0, C: 0, D: 0 };
            let userBetsThisRound = JSON.parse(localStorage.getItem("flipx_user_bets")) || { A: 0, B: 0, C: 0, D: 0 };

            let cards = ['A', 'B', 'C', 'D'];
            let minCard = cards.reduce((prev, curr) => totalBets[curr] < totalBets[prev] ? curr : prev);
            let winnerCard = minCard;

            let email = localStorage.getItem("flipx_logged_in_user");
            let users = JSON.parse(localStorage.getItem("flipx_users")) || {};

            if (email && users[email]) {
                let userBetOnWinner = userBetsThisRound[winnerCard] || 0;
                if (userBetOnWinner > 0) {
                    let winnings = userBetOnWinner * 4;
                    users[email].balance += winnings;
                    localStorage.setItem("flipx_users", JSON.stringify(users));
                }
            }

            let historyList = JSON.parse(localStorage.getItem("flipx_history")) || [];
            historyList.unshift({ period: periodNumber, winner: winnerCard });
            if (historyList.length > 10) historyList.pop();
            localStorage.setItem("flipx_history", JSON.stringify(historyList));

            localStorage.setItem("flipx_total_bets", JSON.stringify({ A: 0, B: 0, C: 0, D: 0 }));
            localStorage.setItem("flipx_user_bets", JSON.stringify({ A: 0, B: 0, C: 0, D: 0 }));

            updateUI();

            setTimeout(() => {
                isProcessingWinner = false;
            }, 1000);
        }

        function submitDepositLocal() {
            let amount = Number(document.getElementById("dep-amount").value);
            let utr = document.getElementById("dep-utr").value.trim();
            let email = localStorage.getItem("flipx_logged_in_user");

            if (!amount || amount < 30) {
                alert("Minimum deposit amount ₹30 hai!");
                return;
            }

            if (utr.length !== 12 || isNaN(utr)) {
                alert("❌ Error: UTR number theek 12 digits ka hona chahiye!");
                return;
            }

            let requests = JSON.parse(localStorage.getItem("flipx_requests")) || [];
            requests.push({ id: Date.now(), type: "Deposit", user: email, amount: amount, detail: utr, status: "Pending" });

            localStorage.setItem("flipx_requests", JSON.stringify(requests));
            alert("Deposit request submit ho gayi hai!");
            document.getElementById("dep-amount").value = "";
            document.getElementById("dep-utr").value = "";
        }

        function submitWithdrawalLocal() {
            let amount = Number(document.getElementById("wd-amount").value);
            let upi = document.getElementById("wd-upi").value.trim();
            let email = localStorage.getItem("flipx_logged_in_user");
            let users = JSON.parse(localStorage.getItem("flipx_users")) || {};
            
            let userHasPlayed = users[email] ? users[email].hasPlayed : false;
            if (!userHasPlayed) {
                alert("❌ Error: Aap bina game khele balance withdraw nahi kar sakte! Pehle kam se kam ek baar bet lagayein.");
                return;
            }

            let currentBal = users[email] ? users[email].balance : 0;

            if (!amount || amount < 400 || amount > 1000) {
                alert("Withdrawal limit ₹400 se kam aur ₹1000 se zyada nahi ho sakti!");
                return;
            }

            if (!upi) {
                alert("Kripya apni UPI ID dalein!");
                return;
            }

            if (amount > currentBal) {
                alert("Aapka account balance kam hai!");
                return;
            }

            // 1% Commission Calculation
            let commission = amount * 0.01;
            let finalPayout = amount - commission;

            users[email].balance = currentBal - amount;
            localStorage.setItem("flipx_users", JSON.stringify(users));
            updateUI();

            let requests = JSON.parse(localStorage.getItem("flipx_requests")) || [];
            requests.push({ 
                id: Date.now(), 
                type: "Withdrawal", 
                user: email, 
                amount: amount, 
                commission: commission,
                payout: finalPayout,
                detail: upi, 
                status: "Pending" 
            });

            localStorage.setItem("flipx_requests", JSON.stringify(requests));
            alert("Withdrawal request submit ho gayi! (1% commission deduct hone ke baad final payout ₹" + finalPayout + " banega)");
            document.getElementById("wd-amount").value = "";
            document.getElementById("wd-upi").value = "";
        }
    </script>
</body>
</html>
