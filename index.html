<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlipX Prediction Game</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        .card-box {
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .game-btn {
            padding: 15px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-a { background-color: #ef4444; }
        .btn-b { background-color: #22c55e; }
        .btn-c { background-color: #3b82f6; }
        .btn-d { background-color: #eab308; }
        .game-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        input {
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        .submit-btn {
            background: #22c55e;
            color: #fff;
            border: none;
            padding: 10px;
            font-weight: bold;
            border-radius: 5px;
            width: 100%;
            cursor: pointer;
        }
        .withdraw-btn { background: #ef4444; }
        .qr-container {
            text-align: center;
            background: #ffffff;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
            margin-bottom: 10px;
            display: none;
        }
        .history-table {
            width: 100%;
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            border-collapse: collapse;
        }
        .history-table th, .history-table td {
            padding: 8px;
            border-bottom: 1px solid #334155;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card-box" style="text-align: center;">
            <h3>Balance: ₹<span id="user-balance">0</span></h3>
            <p style="font-size: 12px; color: #94a3b8; margin: 0;" id="user-email-display">User: Player</p>
            <p style="font-size: 15px; color: #38bdf8; margin-top: 5px; font-weight: bold;">
                Timer: <span id="timer">60</span>s <span id="status-text" style="color: #22c55e; font-size: 12px;">(Betting Open)</span>
            </p>
        </div>

        <div class="card-box">
            <h3 style="margin-top: 0; font-size: 15px;">🎮 Place Your Bet</h3>
            <input type="number" id="bet-amount" placeholder="Enter Bet Amount (₹)">
            
            <div class="btn-grid" style="margin-top: 10px; margin-bottom: 0;">
                <button class="game-btn btn-a" id="btn-A" onclick="placeBet('A')">Card A<br><span style="font-size:11px;">4x Payout</span></button>
                <button class="game-btn btn-b" id="btn-B" onclick="placeBet('B')">Card B<br><span style="font-size:11px;">4x Payout</span></button>
                <button class="game-btn btn-c" id="btn-C" onclick="placeBet('C')">Card C<br><span style="font-size:11px;">4x Payout</span></button>
                <button class="game-btn btn-d" id="btn-D" onclick="placeBet('D')">Card D<br><span style="font-size:11px;">4x Payout</span></button>
            </div>
        </div>

        <div class="card-box">
            <h3 style="margin-top: 0;">💳 Deposit Money (Min ₹30)</h3>
            <input type="number" id="dep-amount" placeholder="Enter Amount (Min ₹30)">
            <button class="submit-btn" onclick="generateDynamicQR()">Generate Payment QR Code</button>

            <div id="qr-box" class="qr-container">
                <p style="color: #000; font-size: 13px; margin: 0 0 10px 0; font-weight: bold;">Scan & Pay via any UPI App</p>
                <div id="qrcode" style="display: inline-block;"></div>
                <p style="color: #333; font-size: 12px; margin: 8px 0 0 0;">UPI ID: <b>7568556656@mbk</b></p>
            </div>

            <input type="text" id="dep-utr" placeholder="Enter 12-Digit UTR Number" maxlength="12" style="margin-top: 10px;">
            <button class="submit-btn" onclick="submitDepositLocal()">Submit Deposit Request</button>
        </div>

        <div class="card-box">
            <h3 style="margin-top: 0;">💸 Withdraw Money (₹400 - ₹1000)</h3>
            <input type="number" id="wd-amount" placeholder="Withdraw Amount (₹400 to ₹1000)">
            <input type="text" id="wd-upi" placeholder="Enter UPI ID (e.g. okaxis)">
            <button class="submit-btn withdraw-btn" onclick="submitWithdrawalLocal()">Request Withdrawal</button>
        </div>

        <div class="card-box">
            <h3 style="margin-top: 0; text-align: center; font-size: 15px;">Live Game History</h3>
            <table class="history-table">
                <thead>
                    <tr>
                        <th>Period</th>
                        <th>Winner</th>
                    </tr>
                </thead>
                <tbody id="history-body">
                    <tr><td colspan="2" style="color: #64748b;">No history yet</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let timeLeft = 60;
        let periodNumber = 2026092201;
        let totalBets = { A: 0, B: 0, C: 0, D: 0 };
        let userBetsThisRound = { A: 0, B: 0, C: 0, D: 0 };

        function updateUI() {
            let savedBal = Number(localStorage.getItem("balance") || localStorage.getItem("flipx_balance") || 0);
            document.getElementById("user-balance").innerText = savedBal;
            let userEmail = localStorage.getItem("flipx_user") || "Player";
            document.getElementById("user-email-display").innerText = "User: " + userEmail;
        }

        // Timer Logic
        function startTimer() {
            setInterval(() => {
                timeLeft--;
                document.getElementById("timer").innerText = timeLeft;

                let statusText = document.getElementById("status-text");
                let buttons = document.querySelectorAll(".game-btn");

                if (timeLeft <= 5) {
                    statusText.innerText = "(Betting Closed)";
                    statusText.style.color = "#ef4444";
                    buttons.forEach(btn => btn.disabled = true);
                } else {
                    statusText.innerText = "(Betting Open)";
                    statusText.style.color = "#22c55e";
                    buttons.forEach(btn => btn.disabled = false);
                }

                if (timeLeft <= 0) {
                    declareWinner();
                    timeLeft = 60;
                    periodNumber++;
                    totalBets = { A: 0, B: 0, C: 0, D: 0 };
                    userBetsThisRound = { A: 0, B: 0, C: 0, D: 0 };
                }
            }, 1000);
        }

        // Dynamic QR Code Generator Function
        function generateDynamicQR() {
            let amount = Number(document.getElementById("dep-amount").value);
            if (!amount || amount < 30) {
                alert("Minimum deposit amount ₹30 honi chahiye!");
                return;
            }

            let upiId = "7568556656@mbk";
            let upiString = `upi://pay?pa=${upiId}&pn=FlipX&am=${amount}&cu=INR`;

            let qrBox = document.getElementById("qr-box");
            let qrDiv = document.getElementById("qrcode");
            
            qrDiv.innerHTML = ""; // Purana QR saaf karo
            qrBox.style.display = "block";

            // Naya QR Code generate karo
            new QRCode(qrDiv, {
                text: upiString,
                width: 150,
                height: 150
            });
        }

        // Place Bet Logic
        function placeBet(card) {
            if (timeLeft <= 5) {
                alert("Abhi betting band ho chuki hai!");
                return;
            }

            let betAmt = Number(document.getElementById("bet-amount").value);
            let currentBal = Number(localStorage.getItem("balance") || localStorage.getItem("flipx_balance") || 0);

            if (!betAmt || betAmt <= 0) {
                alert("Kripya valid bet amount dalein!");
                return;
            }

            if (betAmt > currentBal) {
                alert("Aapke account mein insufficient balance hai!");
                return;
            }

            let newBal = currentBal - betAmt;
            localStorage.setItem("balance", newBal);
            localStorage.setItem("flipx_balance", newBal);
            updateUI();

            totalBets[card] += betAmt;
            userBetsThisRound[card] += betAmt;

            alert(`Successfully placed ₹${betAmt} on Card ${card}!`);
            document.getElementById("bet-amount").value = "";
        }

        // Auto Winner Engine
        function declareWinner() {
            let cards = ['A', 'B', 'C', 'D'];
            let minCard = cards.reduce((prev, curr) => totalBets[curr] < totalBets[prev] ? curr : prev);
            let winnerCard = minCard;

            if (userBetsThisRound[winnerCard] > 0) {
                let winnings = userBetsThisRound[winnerCard] * 4;
                let currentBal = Number(localStorage.getItem("balance") || localStorage.getItem("flipx_balance") || 0);
                let finalBal = currentBal + winnings;
                localStorage.setItem("balance", finalBal);
                localStorage.setItem("flipx_balance", finalBal);
                updateUI();
            }

            let historyBody = document.getElementById("history-body");
            if (historyBody.innerHTML.includes("No history yet")) {
                historyBody.innerHTML = "";
            }

            let row = `<tr><td>${periodNumber}</td><td><strong style="color: #38bdf8;">Card ${winnerCard}</strong></td></tr>`;
            historyBody.innerHTML = row + historyBody.innerHTML;
        }

        // Deposit Request (Min ₹30 limit)
        function submitDepositLocal() {
            let amount = Number(document.getElementById("dep-amount").value);
            let utr = document.getElementById("dep-utr").value.trim();
            let user = localStorage.getItem("flipx_user") || "Player";

            if (!amount || amount < 30) {
                alert("Minimum deposit amount ₹30 hai!");
                return;
            }

            if (utr.length !== 12 || isNaN(utr)) {
                alert("Kripya valid 12-digit UTR number dalein!");
                return;
            }

            let requests = JSON.parse(localStorage.getItem("flipx_requests")) || [];
            requests.push({
                id: Date.now(),
                type: "Deposit",
                user: user,
                amount: amount,
                detail: utr,
                status: "Pending"
            });

            localStorage.setItem("flipx_requests", JSON.stringify(requests));
            alert("Deposit request submit ho gayi hai! Admin approval ka wait karein.");
            
            document.getElementById("dep-amount").value = "";
            document.getElementById("dep-utr").value = "";
            document.getElementById("qr-box").style.display = "none";
        }

        // Withdrawal Request (Min ₹400 & Max ₹1000 limit)
        function submitWithdrawalLocal() {
            let amount = Number(document.getElementById("wd-amount").value);
            let upi = document.getElementById("wd-upi").value.trim();
            let user = localStorage.getItem("flipx_user") || "Player";
            let currentBal = Number(localStorage.getItem("balance") || localStorage.getItem("flipx_balance") || 0);

            if (!amount || amount < 400 || amount > 1000) {
                alert("Withdrawal limit ₹400 se kam aur ₹1000 se zyada nahi ho sakti!");
                return;
            }

            if (!upi) {
                alert("Kripya apni UPI ID dalein!");
                return;
            }

            if (amount > currentBal) {
                alert("Aapka account balance kam hai!");
                return;
            }

            let requests = JSON.parse(localStorage.getItem("flipx_requests")) || [];
            requests.push({
                id: Date.now(),
                type: "Withdrawal",
                user: user,
                amount: amount,
                detail: upi,
                status: "Pending"
            });

            localStorage.setItem("flipx_requests", JSON.stringify(requests));
            alert("Withdrawal request successfully submit ho gayi hai!");
            document.getElementById("wd-amount").value = "";
            document.getElementById("wd-upi").value = "";
        }

        updateUI();
        startTimer();
    </script>
</body>
</html>
