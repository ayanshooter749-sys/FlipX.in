<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlipX Prediction Game</title>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        .card-box {
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .game-btn {
            padding: 15px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-a { background-color: #ef4444; }
        .btn-b { background-color: #22c55e; }
        .btn-c { background-color: #3b82f6; }
        .btn-d { background-color: #eab308; }
        input {
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #fff;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        .submit-btn {
            background: #22c55e;
            color: #fff;
            border: none;
            padding: 10px;
            font-weight: bold;
            border-radius: 5px;
            width: 100%;
            cursor: pointer;
        }
        .history-table {
            width: 100%;
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Balance & User Info Header -->
        <div class="card-box" style="text-align: center;">
            <h3>Balance: ₹<span id="user-balance">0</span></h3>
            <p style="font-size: 12px; color: #94a3b8; margin: 0;" id="user-email-display">User: Player</p>
            <p style="font-size: 14px; color: #38bdf8; margin-top: 5px;">Timer: <span id="timer">60</span>s</p>
        </div>

        <!-- Game Betting Buttons -->
        <div class="btn-grid">
            <button class="game-btn btn-a" onclick="placeBet('A')">Card A<br><span style="font-size:11px;">4x Payout</span></button>
            <button class="game-btn btn-b" onclick="placeBet('B')">Card B<br><span style="font-size:11px;">4x Payout</span></button>
            <button class="game-btn btn-c" onclick="placeBet('C')">Card C<br><span style="font-size:11px;">4x Payout</span></button>
            <button class="game-btn btn-d" onclick="placeBet('D')">Card D<br><span style="font-size:11px;">4x Payout</span></button>
        </div>

        <!-- Single Clean Deposit Section -->
        <div class="card-box">
            <h3 style="margin-top: 0;">💳 Deposit Money</h3>
            <p style="font-size: 12px; color: #94a3b8;">Enter amount and 12-digit UTR to add balance:</p>
            
            <input type="number" id="dep-amount" placeholder="Enter Amount (₹)">
            <input type="text" id="dep-utr" placeholder="Enter 12-Digit UTR" maxlength="12">
            
            <button class="submit-btn" onclick="submitDepositLocal()">Submit Request</button>
        </div>

        <!-- Live Game History Section -->
        <div class="card-box">
            <h3 style="margin-top: 0; text-align: center; font-size: 15px;">Live Game History</h3>
            <table class="history-table">
                <tr>
                    <th>Period</th>
                    <th>Winner</th>
                </tr>
                <tr>
                    <td colspan="2" style="padding: 10px; color: #64748b;">No history yet</td>
                </tr>
            </table>
        </div>
    </div>

    <script>
        // Load User Balance & Profile on Start
        function updateUI() {
            let savedBal = Number(localStorage.getItem("balance") || localStorage.getItem("flipx_balance") || 0);
            document.getElementById("user-balance").innerText = savedBal;
            
            let userEmail = localStorage.getItem("flipx_user") || "Player";
            document.getElementById("user-email-display").innerText = "User: " + userEmail;
        }

        // Deposit Request Function
        function submitDepositLocal() {
            let amount = Number(document.getElementById("dep-amount").value);
            let utr = document.getElementById("dep-utr").value.trim();
            let user = localStorage.getItem("flipx_user") || "Player";

            if (!amount || amount <= 0) {
                alert("Kripya sahi amount dalein!");
                return;
            }

            if (utr.length !== 12 || isNaN(utr)) {
                alert("Kripya 12-digit ka valid UTR number dalein!");
                return;
            }

            let requests = JSON.parse(localStorage.getItem("flipx_requests")) || [];
            requests.push({
                id: Date.now(),
                type: "Deposit",
                user: user,
                amount: amount,
                detail: utr,
                status: "Pending"
            });

            localStorage.setItem("flipx_requests", JSON.stringify(requests));
            alert("Deposit request successfully submit ho gayi hai! Admin approval ke baad balance add ho jayega.");
            
            document.getElementById("dep-amount").value = "";
            document.getElementById("dep-utr").value = "";
        }

        function placeBet(card) {
            alert("Bet placed on Card " + card);
        }

        // Run UI Updater
        updateUI();
        setInterval(updateUI, 1000); // Har second balance check karta rahega
    </script>
</body>
</html>
