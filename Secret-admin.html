<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlipX - Easy Admin Panel</title>
    <style>
        body { background: #0f172a; color: #fff; font-family: Arial, sans-serif; padding: 20px; }
        h2 { color: #38bdf8; text-align: center; }
        .req-card { background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid #f59e0b; }
        button { padding: 8px 15px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .btn-approve { background: #22c55e; color: #fff; margin-right: 5px; }
        .btn-reject { background: #ef4444; color: #fff; }
    </style>
</head>
<body>

    <h2>🛠️ FlipX Admin Panel</h2>
    <div id="admin-list">Loading...</div>

    <script>
        function loadRequests() {
            let listDiv = document.getElementById("admin-list");
            let requests = JSON.parse(localStorage.getItem("flipx_requests")) || [];
            let users = JSON.parse(localStorage.getItem("flipx_users")) || {};
            
            // Sirf Pending requests filter karein
            let pending = requests.filter(r => r.status === "Pending");

            listDiv.innerHTML = "";
            if (pending.length === 0) {
                listDiv.innerHTML = "<p style='text-align: center; color: #94a3b8;'>Koi pending request nahi hai.</p>";
                return;
            }

            pending.forEach(req => {
                // User ki recent bet ya activity check karne ke liye
                let userEmail = req.user;
                let userBetsInfo = "N/A";
                
                // Agar user ki koi bet history ya data stored hai toh yahan fetch kar sakte hain
                // Filhaal deposit/withdrawal amount ke sath user ka total balance bhi dikha sakte hain
                let currentBalance = users[userEmail] ? users[userEmail].balance : 0;

                let card = document.createElement("div");
                card.className = "req-card";
                card.innerHTML = `
                    <div>
                        <strong>User:</strong> ${req.user} <br>
                        <strong>Type:</strong> ${req.type} <br>
                        <strong>Request Amount:</strong> ₹${req.amount} <br>
                        <strong>UTR / UPI:</strong> ${req.detail} <br>
                        <strong>Current Balance:</strong> ₹${currentBalance}
                    </div>
                    <div>
                        <button class="btn-approve" onclick="updateReq(${req.id}, 'Approved', ${req.amount}, '${req.user}')">Approve</button>
                        <button class="btn-reject" onclick="updateReq(${req.id}, 'Rejected', 0, '')">Reject</button>
                    </div>
                `;
                listDiv.appendChild(card);
            });
        }

        function updateReq(id, status, amount, username) {
            let requests = JSON.parse(localStorage.getItem("flipx_requests")) || [];
            let req = requests.find(r => r.id === id);
            if (req) {
                req.status = status;
                localStorage.setItem("flipx_requests", JSON.stringify(requests));

                // Agar Approve hua toh sahi user ke account mein balance add karo
                if (status === "Approved" && amount > 0) {
                    let users = JSON.parse(localStorage.getItem("flipx_users")) || {};
                    
                    if (users[username]) {
                        users[username].balance = (users[username].balance || 0) + Number(amount);
                        localStorage.setItem("flipx_users", JSON.stringify(users));
                        alert(`Request Approved! ₹${amount} user (${username}) ke account mein add ho gaye.`);
                    } else {
                        alert(`Error: User database mein nahi mila!`);
                    }
                } else {
                    alert(`Request ${status} kar di gayi hai.`);
                }
                loadRequests();
            }
        }

        loadRequests();
    </script>
</body>
</html>
