<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlipX Admin Control Panel</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 15px; text-align: center; }
        .card-box { background: #1e293b; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        table { width: 100%; font-size: 12px; margin-top: 10px; border-collapse: collapse; }
        th, td { padding: 6px; border-bottom: 1px solid #334155; text-align: center; }
        .btn-approve { background: #22c55e; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card-box">
        <h2>⚙️ FlipX Admin Control Panel</h2>
        <p style="color: #38bdf8; font-size: 13px;">Auto-Engine Active: Least-bet card wins automatically!</p>
    </div>

    <div class="card-box">
        <h3>All Deposits</h3>
        <table>
            <thead><tr><th>User / ID</th><th>Amount</th><th>UTR</th><th>Status</th><th>Action</th></tr></thead>
            <tbody id="dep-table"><tr><td colspan="5">Loading deposits...</td></tr></tbody>
        </table>
    </div>

    <div class="card-box">
        <h3>Pending Withdrawals</h3>
        <table>
            <thead><tr><th>User</th><th>Amount</th><th>UPI</th><th>Action</th></tr></thead>
            <tbody id="wd-table"><tr><td colspan="4">Loading withdrawals...</td></tr></tbody>
        </table>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "https://flipx-c15d5-default-rtdb.firebaseio.com",
            projectId: "flipx-c15d5",
            storageBucket: "flipx-c15d5.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function getSafeKey(email) {
            return email ? email.replace(/[@.]/g, "_") : "user";
        }

        // Load Deposits
        db.ref("deposits").on("value", (snap) => {
            let html = "";
            if (!snap.exists()) {
                document.getElementById("dep-table").innerHTML = '<tr><td colspan="5">No deposits found</td></tr>';
                return;
            }
            
            snap.forEach((child) => {
                let val = child.val();
                let amt = val.amount ? val.amount : 0;
                let userField = val.user || val.userId || 'Unknown';
                let status = val.status || 'Pending';
                
                html += `<tr>
                    <td>${userField}</td>
                    <td>₹${amt}</td>
                    <td>${val.utr || 'N/A'}</td>
                    <td>${status}</td>
                    <td>${status === 'Pending' ? `<button class="btn-approve" onclick="approveDep('${child.key}', '${userField}',${amt})">Approve</button>` : 'Done'}</td>
                </tr>`;
            });
            document.getElementById("dep-table").innerHTML = html;
        });

        function approveDep(key, user, amount) {
            let userKey = getSafeKey(user);
            db.ref("users/" + userKey + "/balance").once("value", (snap) => {
                let currentBal = snap.val() || 0;
                db.ref("users/" + userKey + "/balance").set(currentBal + amount);
                db.ref("deposits/" + key + "/status").set("Approved");
                alert("Deposit Approved & Balance Added!");
            });
        }

        // Load Withdrawals
        db.ref("withdrawals").on("value", (snap) => {
            let html = "";
            if (!snap.exists()) {
                document.getElementById("wd-table").innerHTML = '<tr><td colspan="4">No pending withdrawals</td></tr>';
                return;
            }
            snap.forEach((child) => {
                let val = child.val();
                if(!val.status || val.status === "Pending") {
                    html += `<tr><td>${val.user}</td><td>₹${val.amount}</td><td>${val.upi}</td><td><button class="btn-approve" onclick="approveWd('${child.key}')">Mark Paid</button></td></tr>`;
                }
            });
            document.getElementById("wd-table").innerHTML = html || '<tr><td colspan="4">No pending withdrawals</td></tr>';
        });

        function approveWd(key) {
            db.ref("withdrawals/" + key + "/status").set("Paid");
            alert("Withdrawal marked as Paid!");
        }
    </script>
</body>
</html>
