<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlipX - Admin Panel</title>
    <style>
        body { background: #0f172a; color: #fff; font-family: Arial, sans-serif; padding: 20px; }
        h2 { color: #38bdf8; text-align: center; }
        .req-card { background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        button { padding: 8px 15px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .btn-approve { background: #22c55e; color: #fff; margin-right: 5px; }
        .btn-reject { background: #ef4444; color: #fff; }
    </style>
</head>
<body>

    <h2>🛠️ FlipX Admin Control Panel</h2>
    <div id="requests-list">Loading pending requests...</div>

    <!-- Firebase SDK CDN -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <script>
        // Apni Firebase configuration yahan dalein
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const listDiv = document.getElementById("requests-list");

        // Sirf 'Pending' requests ko fetch karna
        db.collection("requests").where("status", "==", "Pending").onSnapshot((snapshot) => {
            listDiv.innerHTML = "";
            if (snapshot.empty) {
                listDiv.innerHTML = "<p style='text-align: center; color: #94a3b8;'>Koi pending request nahi hai.</p>";
                return;
            }

            snapshot.forEach((doc) => {
                let data = doc.data();
                let card = document.createElement("div");
                card.className = "req-card";
                card.innerHTML = `
                    <div>
                        <strong>Type:</strong> ${data.type} <br>
                        <strong>User:</strong> ${data.user} <br>
                        <strong>Amount:</strong> ₹${data.amount} <br>
                        <strong>UTR/UPI:</strong> ${data.detail}
                    </div>
                    <div>
                        <button class="btn-approve" onclick="approveRequest('${doc.id}', '${data.user}', ${data.amount}, '${data.type}')">Approve</button>
                        <button class="btn-reject" onclick="rejectRequest('${doc.id}')">Reject</button>
                    </div>
                `;
                listDiv.appendChild(card);
            });
        });

        // Request Approve karne par balance update hoga
        function approveRequest(docId, username, amount, type) {
            // 1. Request ka status 'Approved' update karo database mein
            db.collection("requests").doc(docId).update({
                status: "Approved"
            }).then(() => {
                // 2. Agar Deposit hai toh user ke balance mein paise jodo
                if (type === "Deposit") {
                    db.collection("users").where("username", "==", username).get().then((querySnapshot) => {
                        if (!querySnapshot.empty) {
                            querySnapshot.forEach((userDoc) => {
                                let currentBal = userDoc.data().balance || 0;
                                let newBal = currentBal + amount;
                                db.collection("users").doc(userDoc.id).update({ balance: newBal });
                            });
                        } else {
                            // Agar user collection mein nahi hai toh naya bana kar balance add kar do
                            db.collection("users").add({
                                username: username,
                                balance: amount
                            });
                        }
                    });
                }
                alert("Request successfully Approved aur balance update ho gaya!");
            }).catch((error) => {
                alert("Error: " + error.message);
            });
        }

        // Request Reject karna
        function rejectRequest(docId) {
            db.collection("requests").doc(docId).update({
                status: "Rejected"
            }).then(() => {
                alert("Request Rejected!");
            });
        }
    </script>
</body>
</html>
