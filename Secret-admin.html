<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>FlipX Admin Control & Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { background: #0f172a; color: #fff; font-family: 'Poppins', sans-serif; padding: 20px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        h2 { margin-bottom: 20px; color: #38bdf8; }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-right: 10px; color: #fff; }
        .btn-red { background: #ef4444; }
        .btn-green { background: #10b981; }
        .btn-violet { background: #8b5cf6; }
        .btn-approve { background: #22c55e; padding: 6px 12px; font-size: 13px; }
        .item-row { background: #0f172a; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <h2>⚡ FlipX Control & Game Engine</h2>

    <div class="card">
        <h3>Live Timer: <span id="adminTimer" style="color: #f59e0b;">60</span>s</h3>
        <p style="color:#94a3b8; font-size: 13px;">Next Preset Result: <strong id="presetVal" style="color:#10b981;">AUTO (Random)</strong></p>
        <div style="margin-top: 15px;">
            <button class="btn btn-red" onclick="setPreset('Red')">Set Win RED</button>
            <button class="btn btn-green" onclick="setPreset('Green')">Set Win GREEN</button>
            <button class="btn btn-violet" onclick="setPreset('Violet')">Set Win VIOLET</button>
        </div>
    </div>

    <div class="card">
        <h3>Pending Deposits (1% Commission Auto-Deducted)</h3>
        <div id="depositList">Loading deposits...</div>
    </div>

    <div class="card">
        <h3>Pending Withdrawals</h3>
        <div id="withdrawList">Loading withdrawals...</div>
    </div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCB5RCfmkEio7FQwikZzAJR8nO2YlIpnBw",
        authDomain: "flipx-c15d5.firebaseapp.com",
        databaseURL: "https://flipx-c15d5-default-rtdb.firebaseio.com",
        projectId: "flipx-c15d5",
        storageBucket: "flipx-c15d5.firebasestorage.app",
        messagingSenderId: "1039577323994",
        appId: "1:1039577323994:web:d9342ff195985b788c48e3",
        measurementId: "G-4F23N3N587"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let forcedWin = null;

    function setPreset(color) {
        forcedWin = color;
        document.getElementById('presetVal').innerText = color;
    }

    let timeLeft = 60;
    setInterval(() => {
        timeLeft--;
        if (timeLeft < 0) {
            timeLeft = 60;
            processRoundEnd();
        }
        db.ref('game/timer').set(timeLeft);
        document.getElementById('adminTimer').innerText = timeLeft;
    }, 1000);

    function processRoundEnd() {
        let winningColor = forcedWin || ['Red', 'Green', 'Red', 'Green', 'Violet'][Math.floor(Math.random() * 5)];
        forcedWin = null;
        document.getElementById('presetVal').innerText = "AUTO (Random)";

        db.ref('history').push({ result: winningColor, timestamp: Date.now() });

        db.ref('bets').once('value', snap => {
            let bets = snap.val();
            if (bets) {
                for (let uId in bets) {
                    let b = bets[uId];
                    if (b.color === winningColor) {
                        let multiplier = (winningColor === 'Violet') ? 4.5 : 2;
                        let winAmount = b.amount * multiplier;
                        db.ref('users/' + uId + '/balance').transaction(curr => (curr || 0) + winAmount);
                    }
                }
            }
            db.ref('bets').remove();
        });
    }

    db.ref('deposits').on('value', snap => {
        let list = document.getElementById('depositList');
        list.innerHTML = '';
        let data = snap.val();
        if(!data) { list.innerHTML = '<p style="color:#64748b;">No pending deposits.</p>'; return; }

        for(let key in data) {
            if(data[key].status === 'Pending') {
                let rawAmount = data[key].amount;
                let netCredit = rawAmount * 0.99;
                list.innerHTML += `
                    <div class="item-row">
                        <div>
                            <strong>User:</strong> ${data[key].userId} <br>
                            <strong>Amount:</strong> ₹${rawAmount} | <strong>Net Credit (99%):</strong> ₹${netCredit.toFixed(2)} <br>
                            <strong>UTR:</strong> ${data[key].utr}
                        </div>
                        <button class="btn btn-approve" onclick="approveDep('${key}', '${data[key].userId}', ${netCredit})">Approve</button>
                    </div>`;
            }
        }
    });

    function approveDep(depId, uId, netAmount) {
        db.ref('users/' + uId + '/balance').transaction(curr => (curr || 0) + netAmount);
        db.ref('deposits/' + depId).update({ status: 'Approved' });
    }

    db.ref('withdraws').on('value', snap => {
        let list = document.getElementById('withdrawList');
        list.innerHTML = '';
        let data = snap.val();
        if(!data) { list.innerHTML = '<p style="color:#64748b;">No pending withdrawals.</p>'; return; }

        for(let key in data) {
            if(data[key].status === 'Pending') {
                list.innerHTML += `
                    <div class="item-row">
                        <div>
                            <strong>User:</strong> ${data[key].userId} <br>
                            <strong>Amount:</strong> ₹${data[key].amount} | <strong>UPI:</strong> ${data[key].upi}
                        </div>
                        <button class="btn btn-approve" style="background:#0284c7;" onclick="markPaid('${key}')">Mark Paid</button>
                    </div>`;
            }
        }
    });

    function markPaid(withKey) {
        db.ref('withdraws/' + withKey).update({ status: 'Paid' });
    }
</script>
</body>
</html>
