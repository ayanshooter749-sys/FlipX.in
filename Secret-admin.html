<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlipX Admin Control Panel</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 15px; text-align: center; }
        .card-box { background: #1e293b; padding: 15px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        table { width: 100%; font-size: 12px; margin-top: 10px; border-collapse: collapse; }
        th, td { padding: 6px; border-bottom: 1px solid #334155; text-align: center; }
        .btn-approve { background: #22c55e; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card-box">
        <h2>⚙️ FlipX Admin Control Panel</h2>
        <p style="color: #38bdf8; font-size: 13px;">Auto-Engine Active: Least-bet card wins automatically!</p>
    </div>

    <div class="card-box">
        <h3>Pending Deposits</h3>
        <table>
            <thead><tr><th>User</th><th>Amount</th><th>UTR</th><th>Action</th></tr></thead>
            <tbody id="dep-table"><tr><td colspan="4">No pending deposits</td></tr></tbody>
        </table>
    </div>

    <div class="card-box">
        <h3>Pending Withdrawals</h3>
        <table>
            <thead><tr><th>User</th><th>Amount</th><th>UPI</th><th>Action</th></tr></thead>
            <tbody id="wd-table"><tr><td colspan="4">No pending withdrawals</td></tr></tbody>
        </table>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "https://flipx-in-default-rtdb.firebaseio.com",
            projectId: "flipx-in",
            storageBucket: "flipx-in.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function getSafeKey(email) {
            return email.replace(/[@.]/g, "_");
        }

        // Load Deposits
        db.ref("deposits").on("value", (snap) => {
            let html = "";
            snap.forEach((child) => {
                let val = child.val();
                if(val.status === "Pending") {
                    html += `<tr><td>${val.user}</td><td>₹${val.amount.toFixed(2)}</td><td>${val.utr}</td><td><button class="btn-approve" onclick="approveDep('${child.key}', '${val.user}', ${val.amount})">Approve</button></td></tr>`;
                }
            });
            document.getElementById("dep-table").innerHTML = html || '<tr><td colspan="4">No pending deposits</td></tr>';
        });

        function approveDep(key, user, amount) {
            let userKey = getSafeKey(user);
            db.ref("users/" + userKey + "/balance").once("value", (snap) => {
                let currentBal = snap.val() || 0;
                db.ref("users/" + userKey + "/balance").set(currentBal + amount);
                db.ref("deposits/" + key + "/status").set("Approved");
                alert("Deposit Approved & Balance Added!");
            });
        }

        // Load Withdrawals
        db.ref("withdrawals").on("value", (snap) => {
            let html = "";
            snap.forEach((child) => {
                let val = child.val();
                if(val.status === "Pending") {
                    html += `<tr><td>${val.user}</td><td>₹${val.amount}</td><td>${val.upi}</td><td><button class="btn-approve" onclick="approveWd('${child.key}')">Mark Paid</button></td></tr>`;
                }
            });
            document.getElementById("wd-table").innerHTML = html || '<tr><td colspan="4">No pending withdrawals</td></tr>';
        });

        function approveWd(key) {
            db.ref("withdrawals/" + key + "/status").set("Paid");
            alert("Withdrawal marked as Paid!");
        }

        // --- GAME ENGINE ---
        setInterval(() => {
            db.ref("game/timer").once("value", (snap) => {
                let t = snap.val();
                if(t === null || t <= 1) {
                    runGameEngine();
                    db.ref("game/timer").set(60);
                } else {
                    db.ref("game/timer").set(t - 1);
                }
            });
        }, 1000);

        function runGameEngine() {
            db.ref("pools").once("value", (snap) => {
                let pools = snap.val() || { "Card A (4x)": 0, "Card B (4x)": 0, "Card C (4x)": 0, "Card D (4x)": 0 };
                let minCard = "Card A (4x)";
                let minVal = pools["Card A (4x)"] || 0;

                for(let card in pools) {
                    if((pools[card] || 0) < minVal) {
                        minVal = pools[card] || 0;
                        minCard = card;
                    }
                }

                let periodNo = "2026" + Math.floor(Date.now() / 60000);
                db.ref("history").push({ period: periodNo, winner: minCard });

                db.ref("bets").once("value", (bSnap) => {
                    bSnap.forEach((bChild) => {
                        let bet = bChild.val();
                        if(bet.choice === minCard) {
                            let userKey = getSafeKey(bet.user);
                            db.ref("users/" + userKey + "/balance").once("value", (uSnap) => {
                                let bal = uSnap.val() || 0;
                                db.ref("users/" + userKey + "/balance").set(bal + (bet.amount * 4));
                            });
                        }
                    });
                    db.ref("pools").set({ "Card A (4x)": 0, "Card B (4x)": 0, "Card C (4x)": 0, "Card D (4x)": 0 });
                    db.ref("bets").remove();
                });
            });
        }
    </script>
</body>
</html>
