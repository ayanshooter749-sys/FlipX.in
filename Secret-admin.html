 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Admin Panel - FlipX</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #090d16; color: #fff; margin: 0; padding: 15px; text-align: center; }
        .box { background: #1e293b; padding: 15px; border-radius: 10px; margin-bottom: 15px; }
        button { padding: 8px 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; background: #22c55e; color: white; margin: 3px; }
        .reject { background: #ef4444; }
    </style>
</head>
<body>
    <h2>⚙️ FlipX Admin Control Panel</h2>
    <p>Auto-Engine Active: Least-bet card wins automatically!</p>

    <div class="box">
        <h3>Pending Deposits</h3>
        <div id="admin-deposits">No pending deposits</div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Automatic Timer & Least-Bet Engine
        setInterval(() => {
            db.ref("game/timer").once("value", (snap) => {
                let t = snap.val() ?? 60;
                if(t > 0) {
                    db.ref("game/timer").set(t - 1);
                } else {
                    db.ref("pools").once("value", (poolSnap) => {
                        let pools = poolSnap.val() || { "Card A (4x)": 0, "Card B (4x)": 0, "Card C (4x)": 0, "Card D (4x)": 0 };
                        
                        let minCard = "Card A (4x)";
                        let minVal = pools["Card A (4x)"] || 0;
                        
                        for(let card in pools) {
                            if((pools[card] || 0) < minVal) {
                                minVal = pools[card] || 0;
                                minCard = card;
                            }
                        }

                        let periodNo = "2026" + Math.floor(Date.now() / 1000);
                        db.ref("history/" + Date.now()).set({ period: periodNo, winner: minCard });

                        db.ref("bets").once("value", (betSnap) => {
                            betSnap.forEach((bChild) => {
                                let bData = bChild.val();
                                if(bData.choice === minCard) {
                                    let userPhone = bData.user || bChild.key.split('_')[0];
                                    db.ref("users/" + userPhone + "/balance").transaction((currentBal) => {
                                        return (currentBal || 0) + (bData.amount * 4);
                                    });
                                }
                            });
                            db.ref("bets").remove();
                            db.ref("pools").set({ "Card A (4x)": 0, "Card B (4x)": 0, "Card C (4x)": 0, "Card D (4x)": 0 });
                        });

                        db.ref("game/timer").set(60);
                    });
                }
            });
        }, 1000);

        db.ref("deposits").on("value", (snap) => {
            let html = "";
            snap.forEach((child) => {
                let d = child.val();
                let id = child.key;
                if(d.status === "Pending") {
                    html += `<div>User: ${d.user} | ₹${d.amount} | UTR: ${d.utr} <br>
                             <button onclick="approveDep('${id}', '${d.user}', ${d.amount})">Approve</button>
                             <button class="reject" onclick="rejectDep('${id}')">Reject</button></div><hr>`;
                }
            });
            document.getElementById("admin-deposits").innerHTML = html || "No pending deposits";
        });

        function approveDep(id, user, amt) {
            db.ref("users/" + user + "/balance").transaction(b => (b || 0) + amt);
            db.ref("deposits/" + id + "/status").set("Approved");
        }
        function rejectDep(id) {
            db.ref("deposits/" + id + "/status").set("Rejected");
        }
    </script>
</body>
</html>
